# typos configuration. The Lean sources under lean/ use short hypothesis
# and universe names (`UE`, `hBA`, ...) that the identifier splitter reads
# as misspellings; accept them as words.
[default.extend-words]
UE = "UE"
BA = "BA"
# The paper's \fillin placeholder macro, referenced by the plotting pipeline.
fillin = "fillin"
fillins = "fillins"
# The ablation campaign's short slug in the experiment matrix.
abl = "abl"
