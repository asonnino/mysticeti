# Geo-distributed committee calibrated from the AWS testbed.
#
#   cargo run -- simulate --config-path crates/simulator/examples/geography.yaml
#
# Authority `i` sits in `regions[i % 6]`, the round-robin the orchestrator uses when it
# selects instances, so with 50 replicas Tokyo (ap-northeast-1) hosts indices 5, 11, ..., 47.
# A message takes half the RTT between the two regions plus a uniform `extra_ms`.
name: aws-six-regions
committee_size: 50
latency:
  geographic:
    regions:
      - us-east-1
      - us-east-2
      - eu-central-1
      - eu-west-2
      - eu-west-3
      - ap-northeast-1
    # Region-to-region median RTT in ms, measured on 2026-09-18. One direction per pair is
    # enough: a missing direction falls back to the reverse one.
    rtt_ms:
      us-east-1:
        us-east-1: 0.2
        us-east-2: 11.4
        eu-central-1: 90.6
        eu-west-2: 75.3
        eu-west-3: 82.2
        ap-northeast-1: 146.4
      us-east-2:
        us-east-2: 0.6
        eu-central-1: 95.6
        eu-west-2: 86.1
        eu-west-3: 90.7
        ap-northeast-1: 134.8
      eu-central-1:
        eu-central-1: 0.4
        eu-west-2: 12.0
        eu-west-3: 8.2
        ap-northeast-1: 238.3
      eu-west-2:
        eu-west-2: 0.2
        eu-west-3: 7.4
        ap-northeast-1: 212.2
      eu-west-3:
        eu-west-3: 0.1
        ap-northeast-1: 219.2
      ap-northeast-1:
        ap-northeast-1: 0.3
    # Processing time and jitter added to every message (end exclusive).
    extra_ms: {start: 0, end: 1}
duration_secs: 20
rng_seed: 0
topology: fullMesh
load_generator:
  load: 100 # transactions per second
  transaction_size: 512 # bytes per transaction (must exceed 16-byte header)
